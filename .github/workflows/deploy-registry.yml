name: Deploy public registry

# M0-08: deploys the static export of apps/registry-public to Vercel
# (intended production host: registry.aether-ui.dev).
#
# Disabled until the owner sets:
#   - repository VARIABLE (Settings → Secrets and variables → Actions → Variables)
#       ENABLE_REGISTRY_DEPLOY=true
#     (Must be a variable, not a secret — GitHub cannot use secrets in job `if:`.)
#   - repository SECRETS:
#       VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# See docs/roadmap/audits/m0-08-cdn-runbook.md.

on:
  push:
    branches:
      - main
    paths:
      - "apps/registry-public/**"
      - "registry/public/**"
      - "packages/ui/src/**"
      - "packages/patterns/src/**"
      - "packages/blocks/src/**"
      - "tooling/scripts/src/build-registry.ts"
      - ".github/workflows/deploy-registry.yml"
  workflow_dispatch:

concurrency:
  group: deploy-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy registry CDN
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ vars.ENABLE_REGISTRY_DEPLOY == 'true' }}

    steps:
      - name: Preflight — require Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            # Indirect expansion without printing values.
            eval "val=\${$name:-}"
            if [ -z "$val" ]; then
              echo "::error::Missing repository secret $name"
              missing=1
            else
              echo "OK $name is set"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID under Settings → Secrets and variables → Actions → Secrets. ENABLE_REGISTRY_DEPLOY must be a Variable (already checked via job if)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build registry artefacts
        run: pnpm --filter @aetherstack/scripts build-registry

      - name: Build static export (out/)
        run: pnpm --filter @aetherstack/registry-public build

      - name: Deploy out/ to Vercel production
        working-directory: apps/registry-public
        run: |
          set -euo pipefail
          test -d out
          npx --yes vercel@41 deploy out \
            --prod \
            --yes \
            --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Smoke production registry
        run: |
          set -euo pipefail
          for path in /r/registry.json /r/button.json /llms.txt; do
            code=$(curl -sS -o /tmp/reg-smoke -w "%{http_code}" "https://registry.aether-ui.dev${path}")
            echo "${path} → ${code}"
            if [ "$code" != "200" ]; then
              echo "::error::Expected HTTP 200 for ${path}, got ${code}"
              head -c 200 /tmp/reg-smoke || true
              exit 1
            fi
          done
          echo "Smoke OK"
