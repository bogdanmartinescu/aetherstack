name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release packages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write       # create GitHub releases and tags
      pull-requests: write  # open the Version Packages PR
      packages: write       # publish to GitHub Packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so changesets can determine what changed.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Changesets action ────────────────────────────────────────────────────
      # When there are pending changesets on main:
      #   → Opens / updates a "Version Packages" PR that bumps versions and
      #     updates CHANGELOGs. Merging that PR then triggers publishing.
      # When main already has the bumped versions (PR was merged):
      #   → Builds all packages and publishes them to npm.
      - name: Create Release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── GitHub Packages (mirror publish) ────────────────────────────────────
      # Publishes every public @aetherstack/* package to npm.pkg.github.com so
      # the repository's Packages section is populated.
      #
      # Requirements:
      #   • The GitHub organisation must be named "aetherstack" (scope must
      #     match the org/user that owns the repository).
      #   • No extra secret needed — GITHUB_TOKEN with packages:write suffices.
      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for dir in packages/*/; do
            pkg="${dir}package.json"
            [ -f "$pkg" ] || continue
            name=$(node -p "require('./$pkg').name")
            priv=$(node -p "require('./$pkg').private || false")
            if [[ "$name" == @aetherstack/* && "$priv" == "false" ]]; then
              echo "→ $name"
              (cd "$dir" && npm publish \
                --registry https://npm.pkg.github.com \
                --access public) \
              || echo "  ↳ skipped (already published or error)"
            fi
          done
