name: Release

# On push to main: open/update the Version Packages PR when changesets exist.
# npm publish is owner-gated: only runs on workflow_dispatch after npm org
# publish access is confirmed (auto-publish was failing with E404 for new
# @aetherstack/* package names / insufficient token scope).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish to npm (requires NPM_TOKEN with publish rights on @aetherstack)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release packages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write # create GitHub releases and tags
      pull-requests: write # open the Version Packages PR

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so changesets can determine what changed.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Changesets action ────────────────────────────────────────────────────
      # When there are pending changesets on main:
      #   → Opens / updates a "Version Packages" PR that bumps versions and
      #     updates CHANGELOGs.
      # When publishing is enabled (workflow_dispatch only):
      #   → Builds packages and runs `changeset publish`.
      - name: Create Release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          # Empty publish on push → version PR only (no accidental npm publish).
          publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'pnpm release' || '' }}
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
