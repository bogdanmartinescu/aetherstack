name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancel any in-progress run on the same ref to save compute.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Set to your Turbo remote cache credentials if you want cross-CI caching.
  # Leave blank to use only local Turbo cache (still fast for repeat steps).
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ─── Typecheck + Lint ───────────────────────────────────────────────────────
  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-check-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-check-

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Lint all packages
        run: pnpm lint

  # ─── Tests ──────────────────────────────────────────────────────────────────
  # Runs Vitest for every package that has a test script.
  # tokens, ui, patterns, blocks, cli, registry-schema, registry-build.
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-

      # The CLI integration test reads from apps/registry-public/public/r/, so
      # the registry must be built before the CLI tests run.
      - name: Build registry artefacts (for CLI integration tests)
        run: pnpm --filter @aetherstack/scripts build-registry

      - name: Test — @aetherstack/tokens
        run: pnpm --filter @aetherstack/tokens test

      - name: Test — @aetherstack/ui
        run: pnpm --filter @aetherstack/ui test

      - name: Test — @aetherstack/patterns
        run: pnpm --filter @aetherstack/patterns test

      - name: Test — @aetherstack/blocks
        run: pnpm --filter @aetherstack/blocks test

      - name: Test — @aetherstack/registry-schema
        run: pnpm --filter @aetherstack/registry-schema test

      - name: Test — @aetherstack/registry-build
        run: pnpm --filter @aetherstack/registry-build test

      - name: Test — @aetherstack/cli
        run: pnpm --filter @aetherstack/cli test

      - name: Test — @aetherstack/mcp-server
        run: pnpm --filter @aetherstack/mcp-server test

  # ─── Registry validation ────────────────────────────────────────────────────
  # Validates schema integrity (including AI metadata) AND ensures committed
  # per-item JSON files and llms.txt match what `build-registry` would emit.
  # Catches drift where someone edits registry/public/registry.json without
  # re-running the build.
  registry:
    name: Registry
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate registry manifests
        run: pnpm --filter @aetherstack/scripts validate-registry

      - name: Build registry artefacts
        run: pnpm --filter @aetherstack/scripts build-registry

      - name: Fail if committed registry artefacts are stale
        run: |
          STALE=0
          if ! git diff --quiet --exit-code -- apps/registry-public/public/r; then
            echo "::error::Committed registry artefacts in apps/registry-public/public/r/ are out of date. Run 'pnpm --filter @aetherstack/scripts build-registry' and commit the result."
            git --no-pager diff -- apps/registry-public/public/r
            STALE=1
          fi
          if ! git diff --quiet --exit-code -- apps/registry-public/public/llms.txt; then
            echo "::error::Committed llms.txt is out of date. Run 'pnpm --filter @aetherstack/scripts build-registry' and commit the result."
            git --no-pager diff -- apps/registry-public/public/llms.txt
            STALE=1
          fi
          if [ "$STALE" -eq 1 ]; then exit 1; fi

  # ─── Changeset check (PRs only) ─────────────────────────────────────────────
  # Fails when a PR modifies packages/*/src/** without adding a .changeset/*.md.
  # This enforces the changeset discipline documented in CONTRIBUTING.md.
  changeset:
    name: Changeset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect package changes without a changeset
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF"
          BASE_SHA=$(git rev-parse "origin/$BASE_REF")
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD)
          PACKAGE_TOUCHED=$(echo "$CHANGED" | grep -E '^packages/[^/]+/src/' || true)
          NEW_CHANGESET=$(echo "$CHANGED" | grep -E '^\.changeset/.+\.md$' | grep -v '^\.changeset/README\.md$' || true)

          if [ -n "$PACKAGE_TOUCHED" ] && [ -z "$NEW_CHANGESET" ]; then
            echo "::error::This PR modifies packages/*/src/** but adds no changeset."
            echo "Touched package files:"
            echo "$PACKAGE_TOUCHED"
            echo ""
            echo "Run 'pnpm changeset' and commit the generated .changeset/*.md."
            exit 1
          fi
          echo "Changeset check OK."

  # ─── Build ──────────────────────────────────────────────────────────────────
  # Verifies the workspace builds end-to-end on every push AND every PR.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-

      - name: Build all packages and apps
        run: pnpm build
