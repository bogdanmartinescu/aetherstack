# AetherStack: CircleCI is the exclusive CI/CD runner.
# Web deployments will be added after Cloudflare Workers static exports and
# restricted CircleCI deployment contexts are implemented (CF-01..CF-05).
# GitHub is source control only; do not enable GitHub Actions or Workers Builds.
version: 2.1

parameters:
  publish_npm:
    type: boolean
    default: false
  deploy_registry:
    type: boolean
    default: false
  deploy_docs:
    type: boolean
    default: false

executors:
  node:
    docker:
      - image: cimg/node:22.16
    resource_class: medium
    working_directory: ~/aetherstack

commands:
  setup_project:
    steps:
      - checkout
      - run:
          name: Install pinned pnpm without root permissions
          command: |
            set -euo pipefail
            PNPM_PREFIX="$HOME/.local/pnpm"
            mkdir -p "$PNPM_PREFIX"
            npm install --global --prefix "$PNPM_PREFIX" --no-audit --no-fund pnpm@9.1.0
            export PATH="$PNPM_PREFIX/bin:$PATH"
            # CircleCI sources BASH_ENV before each subsequent run step.
            echo 'export PATH="$HOME/.local/pnpm/bin:$PATH"' >> "$BASH_ENV"
            test "$(pnpm --version)" = "9.1.0"
      - run:
          name: Install workspace dependencies
          command: pnpm install --frozen-lockfile

jobs:
  verify:
    executor: node
    steps:
      - setup_project
      - run:
          name: Format
          command: pnpm format:check
      - run:
          name: TypeScript
          command: pnpm typecheck
      - run:
          name: ESLint
          command: pnpm lint
      - run:
          name: Validate public registry
          command: pnpm --filter @aetherstack/scripts validate-registry
      - run:
          name: Generate registry artifacts
          command: pnpm --filter @aetherstack/scripts build-registry
      - run:
          name: Check registry artifacts are committed and current
          command: |
            git diff --exit-code -- \
              apps/registry-public/public/r \
              apps/registry-public/public/llms.txt \
              apps/docs/public/llms.txt
      - run:
          name: Test
          command: pnpm test
      - run:
          name: Build packages and applications
          command: pnpm build
      - run:
          name: Verify exported public registry
          command: node scripts/verify-registry-output.mjs
      - run:
          name: Verify exported documentation routes
          command: node scripts/verify-docs-output.mjs
      - run:
          name: Clean Next.js and Vite consumer installs
          command: pnpm consumer-install

  deploy_registry:
    executor: node
    steps:
      - setup_project
      - run:
          name: Verify required Cloudflare deployment settings
          command: |
            set -euo pipefail
            for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID REGISTRY_SMOKE_BASE_URL; do
              if [ -z "${!key:-}" ]; then
                echo "Missing $key in the restricted aether-cloudflare-deploy context"
                exit 1
              fi
            done
            if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
              echo "CLOUDFLARE_ACCOUNT_ID must be 32 hexadecimal characters"
              exit 1
            fi
      - run:
          name: Build registry and validate static export
          command: |
            set -euo pipefail
            pnpm --filter @aetherstack/scripts validate-registry
            pnpm --filter @aetherstack/scripts build-registry
            pnpm --filter @aetherstack/registry-public build
            node scripts/verify-registry-output.mjs
      - run:
          name: Deploy preview Worker with pinned Wrangler 4.165.0
          command: |
            set -euo pipefail
            WRANGLER_PREFIX="$HOME/.local/wrangler"
            mkdir -p "$WRANGLER_PREFIX"
            npm install --global --prefix "$WRANGLER_PREFIX" --no-audit --no-fund wrangler@4.165.0
            "$WRANGLER_PREFIX/bin/wrangler" --version
            "$WRANGLER_PREFIX/bin/wrangler" deploy --config apps/registry-public/wrangler.jsonc
      - run:
          name: Smoke-test deployed registry
          command: node scripts/smoke-registry.mjs "$REGISTRY_SMOKE_BASE_URL"

  deploy_docs:
    executor: node
    steps:
      - setup_project
      - run:
          name: Check restricted Cloudflare deployment context
          command: |
            set -euo pipefail
            for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DOCS_SMOKE_BASE_URL; do
              if [ -z "${!key:-}" ]; then
                echo "Missing $key in aether-cloudflare-deploy CircleCI context"
                exit 1
              fi
            done
            if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
              echo "CLOUDFLARE_ACCOUNT_ID must contain 32 hexadecimal characters"
              exit 1
            fi
      - run:
          name: Build static documentation and validate every page
          command: |
            set -euo pipefail
            pnpm --filter @aetherstack/scripts build-registry
            pnpm --filter @aetherstack/docs build
            node scripts/verify-docs-output.mjs
      - run:
          name: Deploy docs preview through Wrangler 4.165.0
          command: |
            set -euo pipefail
            WRANGLER_PREFIX="$HOME/.local/wrangler"
            mkdir -p "$WRANGLER_PREFIX"
            npm install --global --prefix "$WRANGLER_PREFIX" --no-audit --no-fund wrangler@4.165.0
            "$WRANGLER_PREFIX/bin/wrangler" --version
            "$WRANGLER_PREFIX/bin/wrangler" deploy --config apps/docs/wrangler.jsonc
      - run:
          name: Smoke-test deployed documentation
          command: node scripts/smoke-docs.mjs "$DOCS_SMOKE_BASE_URL"

  publish_npm:
    executor: node
    steps:
      - setup_project
      - run:
          name: Require npm release credentials
          command: |
            if [ -z "${NPM_TOKEN:-}" ]; then
              echo "Missing NPM_TOKEN in restricted CircleCI context."
              exit 1
            fi
      - run:
          name: Authenticate to npm without exposing token
          command: |
            umask 077
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
            npm whoami --registry https://registry.npmjs.org
      - run:
          name: Publish already-versioned Changesets packages (manual only)
          command: pnpm release

workflows:
  validate_and_release:
    jobs:
      - verify
      - approve_registry_preview:
          type: approval
          requires:
            - verify
          filters: pipeline.git.branch == "main" and pipeline.parameters.deploy_registry
      - deploy_registry:
          context: aether-cloudflare-deploy
          requires:
            - approve_registry_preview
          filters: pipeline.git.branch == "main" and pipeline.parameters.deploy_registry
      - approve_docs_preview:
          type: approval
          requires:
            - verify
          filters: pipeline.git.branch == "main" and pipeline.parameters.deploy_docs
      - deploy_docs:
          context: aether-cloudflare-deploy
          requires:
            - approve_docs_preview
          filters: pipeline.git.branch == "main" and pipeline.parameters.deploy_docs
      - publish_npm:
          context: aether-npm-release
          requires:
            - verify
          filters: pipeline.git.branch == "main" and pipeline.parameters.publish_npm
